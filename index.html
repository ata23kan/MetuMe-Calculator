<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetuMe Scientific Calculator</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ── Calculator shell ── */
    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      max-width: 420px;
      width: 95vw;
    }

    /* ── Header bar ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      color: #e94560;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Angle mode toggle ── */
    .angle-mode-wrapper { position: relative; }

    .angle-btn {
      background: #0f3460;
      color: #e2e8f0;
      border: 1px solid #e94560;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .angle-btn:hover { background: #e94560; }

    .angle-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: #0f3460;
      border: 1px solid #e94560;
      border-radius: 10px;
      overflow: hidden;
      z-index: 10;
      min-width: 160px;
    }
    .angle-menu.open { display: block; }

    .angle-menu button {
      display: block;
      width: 100%;
      padding: 8px 16px;
      background: transparent;
      color: #e2e8f0;
      border: none;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .angle-menu button:hover { background: #e94560; }
    .angle-menu button.active { background: #e94560; font-weight: 700; }

    /* ── Display area ── */
    .display-wrapper {
      background: #0a0a1a;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1px solid #0f3460;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    #expr-display {
      color: #94a3b8;
      font-size: 13px;
      word-break: break-all;
      min-height: 20px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    #main-display {
      color: #e2e8f0;
      font-size: 30px;
      font-weight: 300;
      text-align: right;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      line-height: 1.6;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* ── Blinking cursor ── */
    .cursor {
      display: inline-block;
      width: 2px;
      background: #e94560;
      height: 0.9em;
      vertical-align: middle;
      margin: 0 1px;
      animation: blink 1s step-end infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Visual fraction ── */
    .frac-display {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 2px;
    }
    .frac-display .frac-num,
    .frac-display .frac-den { font-size: 16px; line-height: 1.1; }
    .frac-display .frac-bar { width: 100%; border-top: 2px solid #e2e8f0; }

    /* ── Button grid ── */
    .buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    button.key {
      border: none;
      border-radius: 10px;
      padding: 13px 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, transform .1s;
      line-height: 1;
    }
    button.key:active { transform: scale(.93); filter: brightness(1.3); }

    /* colour variants */
    .key-num   { background: #1a2a4a; color: #e2e8f0; }
    .key-op    { background: #e94560; color: #fff; }
    .key-fn    { background: #0f3460; color: #64b5f6; }
    .key-trig  { background: #0f3460; color: #81c784; }
    .key-util  { background: #1e3a5f; color: #ffd54f; }
    .key-eq    { background: #e94560; color: #fff; font-size: 18px; }
    .key-clear { background: #7f1d1d; color: #fca5a5; }
    .key-nav   { background: #1a3060; color: #a0c4ff; font-size: 15px; }

    .span2 { grid-column: span 2; }

    /* hover brightness */
    .key-num:hover   { filter: brightness(1.25); }
    .key-op:hover    { filter: brightness(1.2); }
    .key-fn:hover    { filter: brightness(1.3); }
    .key-trig:hover  { filter: brightness(1.3); }
    .key-util:hover  { filter: brightness(1.3); }
    .key-eq:hover    { filter: brightness(1.2); }
    .key-clear:hover { filter: brightness(1.3); }
    .key-nav:hover   { filter: brightness(1.3); }
  </style>
</head>
<body>

<div class="calculator">

  <!-- Header -->
  <div class="header">
    <span class="title">MetuMe · Scientific</span>
    <div class="angle-mode-wrapper">
      <button class="angle-btn" id="angle-toggle-btn">DEG ▾</button>
      <div class="angle-menu" id="angle-menu">
        <button id="mode-deg" class="active" onclick="setAngleMode('deg')">DEG – Degrees</button>
        <button id="mode-rad" onclick="setAngleMode('rad')">RAD – Radians</button>
        <hr style="border-color:#1a3a5f;margin:4px 0">
        <button onclick="convertAndInsert('deg2rad')">Convert → RAD</button>
        <button onclick="convertAndInsert('rad2deg')">Convert → DEG</button>
      </div>
    </div>
  </div>

  <!-- Display -->
  <div class="display-wrapper">
    <div id="expr-display"></div>
    <div id="main-display"><span class="cursor"></span></div>
  </div>

  <!-- Buttons (5 columns) -->
  <div class="buttons">

    <!-- Row 1: trig -->
    <button class="key key-trig" onclick="inputTrig('sin')">sin</button>
    <button class="key key-trig" onclick="inputTrig('cos')">cos</button>
    <button class="key key-trig" onclick="inputTrig('tan')">tan</button>
    <button class="key key-fn"   onclick="inputFn('log10')">log</button>
    <button class="key key-fn"   onclick="inputFn('ln')">ln</button>

    <!-- Row 2: inverse trig + logb + x^y -->
    <button class="key key-trig" onclick="inputTrig('asin')">sin⁻¹</button>
    <button class="key key-trig" onclick="inputTrig('acos')">cos⁻¹</button>
    <button class="key key-trig" onclick="inputTrig('atan')">tan⁻¹</button>
    <button class="key key-fn"   onclick="inputFn('logb')">log_(</button>
    <button class="key key-fn"   onclick="insertToken('**','^')">xʸ</button>

    <!-- Row 3: utility + sqrt + x² -->
    <button class="key key-util" onclick="inputPi()">π</button>
    <button class="key key-util" onclick="inputE()">e</button>
    <button class="key key-util" onclick="inputFraction()">⅟</button>
    <button class="key key-fn"   onclick="inputFn('sqrt')">√</button>
    <button class="key key-fn"   onclick="inputFn('pow2')">x²</button>

    <!-- Row 4: navigation arrows + backspace -->
    <button class="key key-nav" onclick="cursorLeft()">◀</button>
    <button class="key key-nav" onclick="historyUp()">▲</button>
    <button class="key key-nav" onclick="historyDown()">▼</button>
    <button class="key key-nav" onclick="cursorRight()">▶</button>
    <button class="key key-util" onclick="backspace()">⌫</button>

    <!-- Row 5: AC + parens + comma + divide -->
    <button class="key key-clear" onclick="clearAll()">AC</button>
    <button class="key key-fn"    onclick="insertToken('(','(')">( </button>
    <button class="key key-fn"    onclick="insertToken(')',')')"> )</button>
    <button class="key key-fn"    onclick="insertToken(',',',')"> , </button>
    <button class="key key-op"    onclick="insertToken('/','÷')">÷</button>

    <!-- Row 6: 7-9 + × -->
    <button class="key key-num" onclick="insertToken('7','7')">7</button>
    <button class="key key-num" onclick="insertToken('8','8')">8</button>
    <button class="key key-num" onclick="insertToken('9','9')">9</button>
    <button class="key key-op span2" onclick="insertToken('*','×')">×</button>

    <!-- Row 7: 4-6 + − -->
    <button class="key key-num" onclick="insertToken('4','4')">4</button>
    <button class="key key-num" onclick="insertToken('5','5')">5</button>
    <button class="key key-num" onclick="insertToken('6','6')">6</button>
    <button class="key key-op span2" onclick="insertToken('-','−')">−</button>

    <!-- Row 8: 1-3 + + -->
    <button class="key key-num" onclick="insertToken('1','1')">1</button>
    <button class="key key-num" onclick="insertToken('2','2')">2</button>
    <button class="key key-num" onclick="insertToken('3','3')">3</button>
    <button class="key key-op span2" onclick="insertToken('+','+')">+</button>

    <!-- Row 9: % + 0 + . + = -->
    <button class="key key-util" onclick="insertToken('%','%')">%</button>
    <button class="key key-num"  onclick="insertToken('0','0')">0</button>
    <button class="key key-num"  onclick="inputDot()">.</button>
    <button class="key key-eq span2" onclick="calculate()">=</button>

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   STATE
   Each token: { raw: string, disp: string }
   raw  – the JavaScript-evaluable fragment
   disp – the human-readable fragment shown to the user
═══════════════════════════════════════════════ */
const MAX_HISTORY = 10; // maximum number of history entries to retain

let tokens      = [];    // array of {raw, disp}
let cursorIdx   = 0;     // insert/cursor position within tokens array
let angleMode   = 'deg'; // 'deg' | 'rad'
let justEvaled  = false; // true right after = is pressed
let resultDisplay = '';  // last formatted result (shown when justEvaled)

// History: last 10 evaluated expressions
let history     = [];    // [{tokens: [...], result: string}]
let historyIdx  = -1;    // -1 = live input; 0..n = browsing history
let savedTokens = [];
let savedCursor = 0;
let savedJustEvaled = false;
let savedExprText = '';

/* ═══════════════════════════════════════════════
   ANGLE MODE
═══════════════════════════════════════════════ */
function setAngleMode(mode) {
  angleMode = mode;
  document.getElementById('angle-toggle-btn').textContent =
      mode === 'deg' ? 'DEG ▾' : 'RAD ▾';
  document.getElementById('mode-deg').classList.toggle('active', mode === 'deg');
  document.getElementById('mode-rad').classList.toggle('active', mode === 'rad');
  closeAngleMenu();
}

document.getElementById('angle-toggle-btn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('angle-menu').classList.toggle('open');
});
document.addEventListener('click', () => closeAngleMenu());
document.getElementById('angle-menu').addEventListener('click', e => e.stopPropagation());
function closeAngleMenu() { document.getElementById('angle-menu').classList.remove('open'); }

/* ═══════════════════════════════════════════════
   CONVERSION HELPERS
═══════════════════════════════════════════════ */
function convertAndInsert(direction) {
  closeAngleMenu();
  const val = parseFloat(document.getElementById('main-display').textContent);
  if (isNaN(val)) return;
  const result = direction === 'deg2rad' ? val * Math.PI / 180 : val * 180 / Math.PI;
  const fmt = formatNumber(result);
  resultDisplay = fmt;
  tokens = [];
  cursorIdx = 0;
  justEvaled = true;
  historyIdx = -1;
  document.getElementById('main-display').textContent = fmt;
}

/* ═══════════════════════════════════════════════
   TOKEN INSERTION  (core input primitive)
═══════════════════════════════════════════════ */
function insertToken(raw, disp) {
  // If browsing history, stop browsing and keep the loaded expression
  if (historyIdx !== -1) {
    historyIdx = -1;
  }

  if (justEvaled) {
    // Operators continue from the result; anything else starts fresh
    const contOps = ['+', '-', '*', '/', '**', '%'];
    if (contOps.includes(raw)) {
      tokens = [{ raw: resultDisplay, disp: resultDisplay }];
      cursorIdx = 1;
    } else {
      tokens = [];
      cursorIdx = 0;
    }
    justEvaled = false;
    document.getElementById('expr-display').textContent = '';
  }

  tokens.splice(cursorIdx, 0, { raw, disp });
  cursorIdx++;
  updateDisplay();
}

/* ═══════════════════════════════════════════════
   SPECIALISED INPUT HELPERS
═══════════════════════════════════════════════ */
function inputDot() {
  // Prevent a second decimal point in the current number run
  let numStr = '';
  for (let i = cursorIdx - 1; i >= 0; i--) {
    if (/^[0-9.]$/.test(tokens[i].raw)) { numStr = tokens[i].raw + numStr; }
    else break;
  }
  if (numStr.includes('.')) return;
  insertToken('.', '.');
}

function inputPi() { insertToken('Math.PI', 'π'); }
function inputE()  { insertToken('Math.E',  'e'); }

function inputFraction() {
  // Insert a visual-fraction slash (renders as stacked fraction for n/m)
  insertToken('/', '/');
}

function inputTrig(fn) {
  const dispMap = {
    sin: 'sin(', cos: 'cos(', tan: 'tan(',
    asin: 'sin⁻¹(', acos: 'cos⁻¹(', atan: 'tan⁻¹('
  };
  insertToken(`__${fn}(`, dispMap[fn] || `${fn}(`);
}

function inputFn(fn) {
  switch (fn) {
    case 'sqrt':  insertToken('Math.sqrt(',  '√(');    break;
    case 'pow2':  insertToken('**2',         '²');     break;
    case 'log10': insertToken('Math.log10(', 'log(');  break;
    case 'ln':    insertToken('Math.log(',   'ln(');   break;
    case 'logb':  insertToken('__logb(',     'log_('); break;
  }
}

/* ═══════════════════════════════════════════════
   KEYBOARD FUNCTION RECOGNITION
   When "(" is pressed, look back at consecutive single-letter tokens
   before the cursor. If they spell a known function name, replace them
   with the proper function token (which includes the opening parenthesis).
═══════════════════════════════════════════════ */

// When "(" is pressed from the keyboard, look back at consecutive single-letter tokens
// before the cursor. If they spell a known function name, replace them with the proper
// function token (which already includes the opening parenthesis).
// Returns true if a function was recognised and inserted; false otherwise.
function tryRecognizeFunctionFromTokens() {
  let end = cursorIdx;
  let start = end;
  while (start > 0 && /^[a-z]$/i.test(tokens[start - 1].raw)) {
    start--;
  }
  if (start === end) return false;
  const name = tokens.slice(start, end).map(t => t.raw).join('').toLowerCase();
  const fn = TYPED_FUNCTIONS[name];
  if (!fn) return false;
  tokens.splice(start, end - start, { raw: fn[0], disp: fn[1] });
  cursorIdx = start + 1;
  return true;
}

/* ═══════════════════════════════════════════════
   CLEAR / BACKSPACE
═══════════════════════════════════════════════ */
function clearAll() {
  tokens = [];
  cursorIdx = 0;
  justEvaled = false;
  historyIdx = -1;
  resultDisplay = '';
  document.getElementById('expr-display').textContent = '';
  updateDisplay();
}

function backspace() {
  if (historyIdx !== -1) { historyIdx = -1; }
  if (justEvaled) { clearAll(); return; }
  if (cursorIdx > 0) {
    tokens.splice(cursorIdx - 1, 1);
    cursorIdx--;
  }
  updateDisplay();
}

/* ═══════════════════════════════════════════════
   CURSOR NAVIGATION
═══════════════════════════════════════════════ */
function cursorLeft() {
  if (historyIdx !== -1) { historyIdx = -1; }
  if (justEvaled) return;
  if (cursorIdx > 0) cursorIdx--;
  updateDisplay();
}

function cursorRight() {
  if (historyIdx !== -1) { historyIdx = -1; }
  if (justEvaled) return;
  if (cursorIdx < tokens.length) cursorIdx++;
  updateDisplay();
}

/* ═══════════════════════════════════════════════
   HISTORY NAVIGATION
═══════════════════════════════════════════════ */
function historyUp() {
  if (history.length === 0) return;
  if (historyIdx === -1) {
    // Save current editing state before entering history
    savedTokens = tokens.map(t => ({ ...t }));
    savedCursor = cursorIdx;
    savedJustEvaled = justEvaled;
    savedExprText = document.getElementById('expr-display').textContent;
    historyIdx = history.length - 1;
  } else if (historyIdx > 0) {
    historyIdx--;
  } else {
    return; // already at oldest entry
  }
  loadHistoryEntry(historyIdx);
}

function historyDown() {
  if (historyIdx === -1) return;
  if (historyIdx < history.length - 1) {
    historyIdx++;
    loadHistoryEntry(historyIdx);
  } else {
    // Return to the live editing state
    historyIdx = -1;
    tokens = savedTokens;
    cursorIdx = savedCursor;
    justEvaled = savedJustEvaled;
    document.getElementById('expr-display').textContent = savedExprText;
    if (justEvaled) {
      document.getElementById('main-display').textContent = resultDisplay;
    } else {
      updateDisplay();
    }
  }
}

function loadHistoryEntry(idx) {
  const entry = history[idx];
  tokens = entry.tokens.map(t => ({ ...t }));
  cursorIdx = tokens.length;
  justEvaled = false;
  const dispExpr = entry.tokens.map(t => t.disp).join('');
  document.getElementById('expr-display').textContent =
      `[${idx + 1}/${history.length}] ${dispExpr} = ${entry.result}`;
  updateDisplay();
}

/* ═══════════════════════════════════════════════
   DISPLAY
═══════════════════════════════════════════════ */
// A placeholder character (ASCII SOH, \x01) that won't appear in normal input.
// It marks the cursor position before HTML escaping so the cursor span
// survives the escapeHtml → renderFractions pipeline unchanged.
const CURSOR_PH = '\x01';

// Maps typed text (lowercase) to [raw, disp] token pairs for keyboard function entry.
// Functions: buffer the letters then press "(" to commit.
// Constants: flushed automatically on non-letter keypress.
const TYPED_FUNCTIONS = {
  'sin':    ['__sin(',      'sin('],
  'cos':    ['__cos(',      'cos('],
  'tan':    ['__tan(',      'tan('],
  'asin':   ['__asin(',     'sin⁻¹('],
  'arcsin': ['__asin(',     'sin⁻¹('],
  'acos':   ['__acos(',     'cos⁻¹('],
  'arccos': ['__acos(',     'cos⁻¹('],
  'atan':   ['__atan(',     'tan⁻¹('],
  'arctan': ['__atan(',     'tan⁻¹('],
  'sqrt':   ['Math.sqrt(',  '√('],
  'log':    ['Math.log10(', 'log('],
  'log10':  ['Math.log10(', 'log('],
  'ln':     ['Math.log(',   'ln('],
  'abs':    ['Math.abs(',   'abs('],
  'logb':   ['__logb(',     'log_('],
};
const TYPED_CONSTANTS = {
  'pi': ['Math.PI', 'π'],
  'e':  ['Math.E',  'e'],
};

function getDisplayHtml() {
  // Build the display string with cursor placeholder injected
  let disp = '';
  for (let i = 0; i <= tokens.length; i++) {
    if (i === cursorIdx) disp += CURSOR_PH;
    if (i < tokens.length) disp += tokens[i].disp;
  }
  let html = escapeHtml(disp);
  html = renderFractions(html);
  // Replace the placeholder with the cursor span
  html = html.replace(CURSOR_PH, '<span class="cursor"></span>');
  return html || '<span class="cursor"></span>';
}

function updateDisplay() {
  const mainEl = document.getElementById('main-display');
  if (justEvaled) {
    mainEl.textContent = resultDisplay;
  } else {
    mainEl.innerHTML = getDisplayHtml();
    // Scroll the main-display container to keep the cursor visible.
    const CURSOR_SCROLL_PADDING = 4;
    const cur = mainEl.querySelector('.cursor');
    if (cur) {
      const curLeft  = cur.offsetLeft;
      const curRight = curLeft + cur.offsetWidth;
      const visRight = mainEl.scrollLeft + mainEl.clientWidth;
      if (curRight > visRight) {
        mainEl.scrollLeft = curRight - mainEl.clientWidth + CURSOR_SCROLL_PADDING;
      } else if (curLeft < mainEl.scrollLeft) {
        mainEl.scrollLeft = curLeft - CURSOR_SCROLL_PADDING;
      }
    }
  }
}

function renderFractions(html) {
  // Convert digit/digit or (expr)/(expr) patterns to visual stacked fractions.
  // After escapeHtml, the fraction "/" becomes "&#x2F;" while "÷" stays as "÷".
  // group matches either:
  //   - a parenthesised expression, allowing one level of nested parens:
  //       \(  ( any non-paren char  |  a fully nested (…) group )*  \)
  //   - a plain decimal number: \d+(\.\d+)?
  const group = '(?:\\((?:[^()]|\\([^()]*\\))*\\)|\\d+(?:\\.\\d+)?)';
  const re = new RegExp(`(${group})&#x2F;(${group})`, 'g');
  return html.replace(
    re,
    (_m, n, d) =>
      `<span class="frac-display">` +
        `<span class="frac-num">${n}</span>` +
        `<span class="frac-bar"></span>` +
        `<span class="frac-den">${d}</span>` +
      `</span>`
  );
}

function escapeHtml(str) {
  return str
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#039;')
    .replace(/\//g, '&#x2F;');
}

/* ═══════════════════════════════════════════════
   CALCULATION
═══════════════════════════════════════════════ */
function calculate() {
  const expr = tokens.map(t => t.raw).join('');
  if (!expr.trim()) return;

  const dispExpr = tokens.map(t => t.disp).join('');
  const safeExpr = buildSafeExpression(expr);

  let result;
  try {
    // eslint-disable-next-line no-new-func
    result = Function(
      '__sin', '__cos', '__tan', '__asin', '__acos', '__atan', '__logb',
      `"use strict"; return (${safeExpr});`
    )(
      makeTrigFn('sin'),   makeTrigFn('cos'),   makeTrigFn('tan'),
      makeATrigFn('asin'), makeATrigFn('acos'), makeATrigFn('atan'),
      // __logb(base, x) computes log base `base` of `x` via the change-of-base formula
      (base, x) => Math.log(x) / Math.log(base)
    );
  } catch (e) {
    document.getElementById('main-display').textContent = 'Error';
    return;
  }

  if (!isFinite(result)) {
    const msg = isNaN(result) ? 'Undefined' : (result > 0 ? '∞' : '-∞');
    document.getElementById('expr-display').textContent = dispExpr + ' =';
    document.getElementById('main-display').textContent = msg;
    resultDisplay = '';
    tokens = [];
    cursorIdx = 0;
    justEvaled = true;
    return;
  }

  const formatted = formatNumber(result);

  // Add to history (keep last MAX_HISTORY entries)
  if (history.length >= MAX_HISTORY) history.shift();
  history.push({ tokens: tokens.map(t => ({ ...t })), result: formatted });
  historyIdx = -1;

  document.getElementById('expr-display').textContent = dispExpr + ' =';
  resultDisplay = formatted;
  tokens = [];
  cursorIdx = 0;
  justEvaled = true;
  updateDisplay();
}

function buildSafeExpression(expr) {
  return expr.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
}

/* ── Trig wrappers ── */
function makeTrigFn(name) {
  return x => angleMode === 'deg' ? Math[name](x * Math.PI / 180) : Math[name](x);
}

function makeATrigFn(name) {
  return x => {
    const r = Math[name](x);
    return angleMode === 'deg' ? r * 180 / Math.PI : r;
  };
}

/* ── Number formatting ── */
function formatNumber(n) {
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
  const s = parseFloat(n.toPrecision(12));
  return String(s);
}

/* ═══════════════════════════════════════════════
   KEYBOARD SUPPORT
═══════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key;

  // ── Letter keys: insert immediately as individual tokens ──
  if (/^[a-zA-Z]$/.test(k)) {
    insertToken(k.toLowerCase(), k.toLowerCase());
    e.preventDefault();
    return;
  }

  // ── "(" : check preceding letter tokens for a function name, else insert "(" ──
  if (k === '(') {
    if (!tryRecognizeFunctionFromTokens()) {
      insertToken('(', '(');
    }
    updateDisplay();
    e.preventDefault();
    return;
  }

  // ── All other keys ──
  if (k === 'Backspace')          { backspace();             e.preventDefault(); return; }
  if (k === 'Escape')             { clearAll();              e.preventDefault(); return; }

  if ('0123456789'.includes(k)) { insertToken(k, k);        e.preventDefault(); return; }
  if (k === '+')        { insertToken('+', '+');             e.preventDefault(); return; }
  if (k === '-')        { insertToken('-', '−');             e.preventDefault(); return; }
  if (k === '*')        { insertToken('*', '×');             e.preventDefault(); return; }
  if (k === '/')        { insertToken('/', '÷');             e.preventDefault(); return; }
  if (k === '%')        { insertToken('%', '%');             e.preventDefault(); return; }
  if (k === ')')        { insertToken(')', ')');             e.preventDefault(); return; }
  if (k === ',')        { insertToken(',', ',');             e.preventDefault(); return; }
  if (k === '^')        { insertToken('**', '^');            e.preventDefault(); return; }
  if (k === '.')        { inputDot();                        e.preventDefault(); return; }
  if (k === 'Enter' || k === '=') { calculate();            e.preventDefault(); return; }
  if (k === 'ArrowLeft')          { cursorLeft();            e.preventDefault(); return; }
  if (k === 'ArrowRight')         { cursorRight();           e.preventDefault(); return; }
  if (k === 'ArrowUp')            { historyUp();             e.preventDefault(); return; }
  if (k === 'ArrowDown')          { historyDown();           e.preventDefault(); return; }
});
</script>
